<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slither {
        0% { transform: translateX(0px); }
        100% { transform: translateX(800px); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; r: 8; }
        50% { opacity: 0.6; r: 6; }
      }
      
      .snake-head {
        animation: slither 4s linear infinite;
        fill: #ff1744;
      }
      
      .snake-body {
        animation: slither 4s linear infinite;
        fill: #00e676;
        opacity: 0.8;
      }
      
      .food {
        animation: pulse 1s ease-in-out infinite;
        fill: #00ff00;
      }
      
      .title {
        font-size: 20px;
        font-weight: bold;
        fill: #00ff00;
        text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
      }
      
      .grid-line {
        stroke: #1a1a1a;
        stroke-width: 1;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">🐍 Watch My Contributions Get Eaten 🐍</text>
  
  <!-- Grid lines for contribution graph effect -->
  <g class="grid">
    <line x1="0" y1="80" x2="800" y2="80" class="grid-line"/>
    <line x1="0" y1="120" x2="800" y2="120" class="grid-line"/>
    <line x1="0" y1="160" x2="800" y2="160" class="grid-line"/>
    <line x1="0" y1="200" x2="800" y2="200" class="grid-line"/>
  </g>
  
  <!-- Contribution squares (static) -->
  <g id="contributions">
    <!-- Row 1 -->
    <rect x="50" y="90" width="12" height="12" fill="#003d00"/>
    <rect x="70" y="90" width="12" height="12" fill="#005900"/>
    <rect x="90" y="90" width="12" height="12" fill="#008000"/>
    <rect x="110" y="90" width="12" height="12" fill="#00b300"/>
    <rect x="150" y="90" width="12" height="12" fill="#005900"/>
    <rect x="170" y="90" width="12" height="12" fill="#00ff00"/>
    <rect x="190" y="90" width="12" height="12" fill="#00b300"/>
    <rect x="250" y="90" width="12" height="12" fill="#003d00"/>
    <rect x="270" y="90" width="12" height="12" fill="#008000"/>
    <rect x="350" y="90" width="12" height="12" fill="#00ff00"/>
    <rect x="370" y="90" width="12" height="12" fill="#00b300"/>
    <rect x="450" y="90" width="12" height="12" fill="#008000"/>
    <rect x="500" y="90" width="12" height="12" fill="#00ff00"/>
    <rect x="550" y="90" width="12" height="12" fill="#005900"/>
    <rect x="600" y="90" width="12" height="12" fill="#003d00"/>
    <rect x="650" y="90" width="12" height="12" fill="#00ff00"/>
    <rect x="700" y="90" width="12" height="12" fill="#008000"/>
    <rect x="750" y="90" width="12" height="12" fill="#00b300"/>
    
    <!-- Row 2 -->
    <rect x="60" y="130" width="12" height="12" fill="#003d00"/>
    <rect x="80" y="130" width="12" height="12" fill="#008000"/>
    <rect x="120" y="130" width="12" height="12" fill="#00ff00"/>
    <rect x="160" y="130" width="12" height="12" fill="#005900"/>
    <rect x="200" y="130" width="12" height="12" fill="#00b300"/>
    <rect x="260" y="130" width="12" height="12" fill="#008000"/>
    <rect x="320" y="130" width="12" height="12" fill="#00ff00"/>
    <rect x="380" y="130" width="12" height="12" fill="#005900"/>
    <rect x="420" y="130" width="12" height="12" fill="#003d00"/>
    <rect x="480" y="130" width="12" height="12" fill="#00b300"/>
    <rect x="540" y="130" width="12" height="12" fill="#008000"/>
    <rect x="620" y="130" width="12" height="12" fill="#00ff00"/>
    <rect x="680" y="130" width="12" height="12" fill="#005900"/>
    
    <!-- Row 3 -->
    <rect x="40" y="170" width="12" height="12" fill="#005900"/>
    <rect x="100" y="170" width="12" height="12" fill="#00b300"/>
    <rect x="140" y="170" width="12" height="12" fill="#008000"/>
    <rect x="180" y="170" width="12" height="12" fill="#00ff00"/>
    <rect x="240" y="170" width="12" height="12" fill="#003d00"/>
    <rect x="300" y="170" width="12" height="12" fill="#00ff00"/>
    <rect x="360" y="170" width="12" height="12" fill="#005900"/>
    <rect x="410" y="170" width="12" height="12" fill="#008000"/>
    <rect x="470" y="170" width="12" height="12" fill="#00b300"/>
    <rect x="530" y="170" width="12" height="12" fill="#00ff00"/>
    <rect x="590" y="170" width="12" height="12" fill="#003d00"/>
    <rect x="660" y="170" width="12" height="12" fill="#008000"/>
    <rect x="730" y="170" width="12" height="12" fill="#00ff00"/>
  </g>
  
  <!-- Snake Body (segments following path) -->
  <g id="snake">
    <!-- Head -->
    <circle cx="20" cy="96" r="8" class="snake-head"/>
    
    <!-- Body segments -->
    <circle cx="10" cy="96" r="7" class="snake-body" style="animation-delay: -0.1s"/>
    <circle cx="0" cy="96" r="6" class="snake-body" style="animation-delay: -0.2s; opacity: 0.6"/>
    <circle cx="-10" cy="96" r="5" class="snake-body" style="animation-delay: -0.3s; opacity: 0.4"/>
  </g>
  
  <!-- Food/Pellets being eaten -->
  <g id="food-items">
    <circle cx="170" cy="96" r="8" class="food" style="animation-delay: 0s"/>
    <circle cx="350" cy="96" r="8" class="food" style="animation-delay: 1s"/>
    <circle cx="500" cy="96" r="8" class="food" style="animation-delay: 0.5s"/>
  </g>
  
  <!-- Score/Info -->
  <text x="20" y="280" font-size="12" fill="#00ff00">Press SPACE to Play Interactive Version</text>
  <text x="550" y="280" font-size="12" fill="#888">Snake eats contributions 🐍 Score: ∞</text>
</svg>